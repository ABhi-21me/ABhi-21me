<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <clipPath id="winRound"><rect x="1" y="1" width="678" height="328" rx="14" ry="14"/></clipPath>
    <clipPath id="clipP1"><rect x="26" y="52" width="0" height="24"><animate attributeName="width" values="0;215;215" keyTimes="0;0.1235;1" dur="8.5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipP2"><rect x="26" y="138" width="0" height="24"><animate attributeName="width" values="0;0;281;281" keyTimes="0;0.2588;0.4235;1" dur="8.5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipP3"><rect x="26" y="224" width="0" height="24"><animate attributeName="width" values="0;0;262;262" keyTimes="0;0.5588;0.7118;1" dur="8.5s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#winRound)">
    <rect x="0" y="0" width="680" height="330" fill="#0B1120"/>
    <rect x="0" y="0" width="680" height="40" fill="#141B2E"/>
    <circle cx="24" cy="20" r="6" fill="#FF5F56"/>
    <circle cx="46" cy="20" r="6" fill="#FFBD2E"/>
    <circle cx="68" cy="20" r="6" fill="#27C93F"/>
    <text x="340" y="25" font-size="13" fill="#64748B" text-anchor="middle">abhi@devops: ~ -zsh</text>

    <!-- Block 1: whoami -->
    <text x="26" y="70" clip-path="url(#clipP1)" font-size="15" font-weight="500" fill="#22D3EE">abhi@devops:~$ whoami</text>
    <text x="26" y="96" font-size="17" font-weight="700" fill="#F1F5F9" opacity="0">Abhishek Vishwakarma
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1235;0.1529;1" dur="8.5s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="120" font-size="14" fill="#94A3B8" opacity="0">Cloud/DevOps engineer-in-training
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1529;0.1824;1" dur="8.5s" repeatCount="indefinite"/>
    </text>

    <!-- Block 2: focus.txt -->
    <text x="26" y="156" clip-path="url(#clipP2)" font-size="15" font-weight="500" fill="#22D3EE">abhi@devops:~$ cat focus.txt</text>
    <text x="26" y="182" font-size="14" fill="#94A3B8" opacity="0">70% Cloud &amp; DevOps &#183; 30% AI-assisted builder
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4235;0.4529;1" dur="8.5s" repeatCount="indefinite"/>
    </text>
    <text x="26" y="206" font-size="14" fill="#94A3B8" opacity="0">Currently shipping: CloudGrid (AWS + Claude)
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4529;0.4824;1" dur="8.5s" repeatCount="indefinite"/>
    </text>

    <!-- Block 3: status -->
    <text x="26" y="242" clip-path="url(#clipP3)" font-size="15" font-weight="500" fill="#22D3EE">abhi@devops:~$ ./status.sh</text>
    <text x="26" y="268" font-size="14" fill="#FBBF24" opacity="0">prepping for placements &#183; open to DevOps internships
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7118;0.7412;1" dur="8.5s" repeatCount="indefinite"/>
    </text>

    <!-- Idle prompt + cursor -->
    <text x="26" y="294" font-size="15" font-weight="500" fill="#22D3EE" opacity="0">abhi@devops:~$
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7412;0.76;1" dur="8.5s" repeatCount="indefinite"/>
    </text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.76;0.78;1" dur="8.5s" repeatCount="indefinite"/>
      <rect x="167" y="281" width="9" height="16" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="1" y="1" width="678" height="328" rx="14" ry="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>
</svg>
